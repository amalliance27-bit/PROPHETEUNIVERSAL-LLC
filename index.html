<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prophete Universal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      /* Hide scrollbar for clean UI but allow scrolling */
      ::-webkit-scrollbar { width: 0px; background: transparent; }
      
      /* Animations */
      @keyframes breathe {
        0%, 100% { opacity: 0.6; transform: scale(0.98); filter: brightness(0.9); }
        50% { opacity: 1; transform: scale(1); filter: brightness(1.1); }
      }
      .animate-breathe {
        animation: breathe 5s ease-in-out infinite;
      }

      /* Avatar Pandora Hypnotic Bioluminescent Slow Pulse */
      @keyframes avatar-biopulse {
        0%, 100% {
          box-shadow: 0 0 6px rgba(0, 255, 65, 0.25);
          border-color: rgba(0, 255, 65, 0.5);
          text-shadow: 0 0 2px rgba(0, 255, 65, 0.3);
          transform: scale(1);
          opacity: 0.9;
        }
        50% {
          box-shadow: 0 0 14px rgba(0, 255, 65, 0.45);
          border-color: rgba(0, 255, 65, 0.9);
          text-shadow: 0 0 4px rgba(0, 255, 65, 0.5);
          transform: scale(1.01);
          opacity: 1;
        }
      }
      .animate-avatar-biopulse {
        animation: avatar-biopulse 4.5s ease-in-out infinite;
      }

      .tour-active-card {
        outline: 4px solid #facc15 !important;
        outline-offset: 6px !important;
        box-shadow: 0 0 35px rgba(250, 204, 21, 0.9) !important;
        transform: scale(1.03) !important;
        transition: all 0.4s ease-in-out !important;
        z-index: 30 !important;
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }

      @keyframes shoot-left {
        0% { transform: translateX(0) scale(1); opacity: 1; }
        50% { opacity: 1; filter: drop-shadow(0 0 25px #facc15); }
        100% { transform: translateX(-120vw) scale(1.5); opacity: 0; }
      }
      .animate-shoot-left {
        animation: shoot-left 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      @keyframes shoot-right {
        0% { transform: translateX(0) scale(1); opacity: 1; }
        50% { opacity: 1; filter: drop-shadow(0 0 25px #facc15); }
        100% { transform: translateX(120vw) scale(1.5); opacity: 0; }
      }
      .animate-shoot-right {
        animation: shoot-right 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes marquee {
        0% { transform: translateX(0%); }
        100% { transform: translateX(-50%); }
      }
      .animate-marquee {
        animation: marquee 60s linear infinite;
      }

      /* Hypnotic Smooth Shift: Glassmorphism Multi-color Oceanic, Royal Purple, Sapphire, and Emerald */
      @keyframes hypnotic-ocean-purple {
        0%, 100% {
          background-color: rgba(9, 45, 59, 0.35);
          border-color: rgba(103, 232, 249, 0.45);
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 0 25px rgba(6, 182, 212, 0.15);
        }
        25% {
          background-color: rgba(74, 14, 78, 0.35);
          border-color: rgba(192, 132, 252, 0.55);
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 0 30px rgba(168, 85, 247, 0.2);
        }
        50% {
          background-color: rgba(15, 23, 60, 0.35);
          border-color: rgba(129, 140, 248, 0.5);
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 0 30px rgba(99, 102, 241, 0.2);
        }
        75% {
          background-color: rgba(6, 48, 43, 0.35);
          border-color: rgba(52, 211, 153, 0.5);
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 0 30px rgba(16, 185, 129, 0.2);
        }
      }
      .animate-hypnotic-ocean-purple {
        animation: hypnotic-ocean-purple 20s ease-in-out infinite;
      }

      /* Bioluminescent Aurora Rim Spinning Beam */
      @keyframes aurora-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .animate-aurora-spin {
        animation: aurora-spin 7s linear infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-teal-50 text-slate-900 antialiased selection:bg-yellow-200 selection:text-teal-900 overflow-x-hidden">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
